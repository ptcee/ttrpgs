<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>ptc games!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Averia+Sans+Libre:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Averia Sans Libre", sans-serif;
            font-size: 16px;
            margin: 0;
        }

        .wrap {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #e3e3d7;
            background: linear-gradient(to top, #5d5b47, #bebebe);

        }

        .card {
            border-radius: 12px;
            padding: 18px 20px;
            margin: 16px;
            background-color: rgba(168, 168, 168, 0.4);
            box-shadow: 0px 5px 5px rgba(0, 0, 0, 0.2); 
            width: 500px;
        }

        hr {
            border: none;
            border-top: 1px solid #fff;
            margin: 10px 0;
            width: 300px;
        }

        h1 {
            font-size: 2em;
            color: #ffffff;
        }

        h4 {
            font-size: 1em;
            color: #ffffff;
            text-align: center;
        }

        nav {
            display: flex;
            flex-direction: column;
            width: 300px;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 10vh auto;
        }

        .button {
            outline: 0;
            grid-gap: 8px;
            align-items: center;
            background-color: #69859abc;
            color: #ffffff;
            border: 2px solid #4081be;
            border-radius: 4px;
            cursor: pointer;
            display: inline-flex;
            flex-shrink: 0;
            font-size: 16px;
            gap: 8px;
            justify-content: center;
            line-height: 1.5;
            overflow: hidden;
            padding: 12px 16px;
            text-decoration: none;
            text-overflow: ellipsis;
            transition: all .14s ease-out;
            white-space: nowrap;
            width: 320px;
        }

        .button:hover {
            box-shadow: 4px 4px 0 #000;
            transform: translate(-4px, -4px);
        }

        .button:focus-visible {
            outline-offset: 1px;
        }

        .wip {
            filter: saturate(10%);
            color: #6c6c6c;
        }

        .wipshake {
            animation: shake 0.5s ease-in-out;
            background-color: #ff0000;
            filter: saturate(100%);
        }

        @keyframes shake {
          0%, 100% { transform: translate3d(0, 0, 0); }
          10%, 30%, 50%, 70%, 90% { transform: translate3d(-6px, 0, 0); }
          20%, 40%, 60%, 80% { transform: translate3d(6px, 0, 0); }
        }
    </style>
</head>

<body>
    <div class="wrap">

        <div class="card">
            <nav>
                <h1>PTC GAMES!</h1>
                <h4>yes hi hello i make rpgs, games and systems when im bored pls enjoy</h4>
                <hr>
                <a href="ANVIL/" class="button">ANVIL</a>
                <a href="osrad/" class="button">OSRad.</a>
                <a href="kobcamp/" class="button">KOBOLD CAMPOUT</a>
                <hr>
                <h4>WIPs</h4>
                <a href="javascript:void(0)" class="button wip" onclick="shaker(this)">RUNES & REELS</a>
                <a href="javascript:void(0)" class="button wip" onclick="shaker(this)">LOOT GOBLINS</a>
                <hr>
                
            </nav>
        </div>
    </div>
    <script>
        function shaker(el) {
            el.classList.remove("wipshake");
            void el.offsetWidth;
            el.classList.add("wipshake");

            setTimeout(() => {
                el.classList.remove("wipshake");
            }, 500);
        }
    </script>

</body>

</html>
